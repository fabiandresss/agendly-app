<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar contraseña — AGENDLY</title>
  <link rel="stylesheet" href="styles/design-system.css?v=0c902f78"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
  <style>
    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* Panel derecho */
    .form-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      overflow-y: auto;
    }
    .form-box {
      width: 100%;
      max-width: 400px;
    }
    .form-heading {
      margin-bottom: 32px;
    }
    .form-heading h2 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-primary);
    }
    .form-heading p {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .fgroup {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 16px;
    }
    .flabel {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap .form-input {
      padding-right: 42px;
    }
    .toggle-pw {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      font-size: 17px;
      padding: 2px;
      transition: color var(--transition-fast);
    }
    .toggle-pw:hover { color: var(--text-secondary); }
    .form-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 22px;
    }
    .form-footer a {
      color: var(--brand-primary);
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      padding: 8px 4px;
    }
    .form-footer a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .form-panel { padding: 32px 24px; align-items: flex-start; padding-top: 52px; }
    }
  </style>
  <script src="config.js?v=7a999ca1"></script>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="styles/auth.css?v=51cea9ba"/>
</head>
<body>

  <header class="ob-topbar">
    <a href="index.html" class="ob-logo" aria-label="Agendly"><img src="assets/logo.png" alt="Agendly" style="height:26px;width:auto;display:block;"></a>
    <a href="login.html" class="ob-top-link">Iniciar sesión</a>
  </header>

  <div class="form-panel">
    <div class="form-box animate-in">

      <div class="form-heading">
        <h2>Recupera tu contraseña</h2>
        <p>Ingresa el email de tu cuenta y te enviaremos un enlace para crear una nueva.</p>
      </div>

      <div class="alert alert-error mb-4" id="msg-error"><span id="msg-error-text"></span></div>
      <div class="alert alert-success mb-4" id="msg-ok"><span id="msg-ok-text"></span></div>

      <form id="forgot-form" novalidate>
        <div class="fgroup" style="margin-bottom:24px;">
          <label class="flabel" for="email">Email</label>
          <input type="email" id="email" class="form-input"
                 placeholder="tu@email.com" autocomplete="email"/>
        </div>

        <button type="submit" id="btn-send" class="btn btn-primary btn-lg btn-full">
          Enviar enlace
        </button>
      </form>

      <div class="form-footer">
        <a href="login.html">&larr; Volver a iniciar sesión</a>
      </div>

    </div>
  </div>

  <script>
    const API = AGENDLY_API;
    const $ = id => document.getElementById(id);

    function showError(msg) { $('msg-ok').classList.remove('visible'); $('msg-error-text').textContent = msg; $('msg-error').classList.add('visible'); }
    function showOk(msg)    { $('msg-error').classList.remove('visible'); $('msg-ok-text').textContent = msg; $('msg-ok').classList.add('visible'); }

    $('email').addEventListener('input', () => $('msg-error').classList.remove('visible'));

    $('forgot-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('email').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Ingresa un email válido'); return; }

      const btn = $('btn-send');
      btn.classList.add('btn-loading');
      btn.disabled = true;

      try {
        const res  = await fetch(`${API}/api/auth/forgot-password`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email }),
        });
        const json = await res.json();

        if (!res.ok) { showError(json.error || 'No pudimos procesar la solicitud'); return; }

        showOk(json.message);
        $('email').value = '';
        // Evita reenvíos seguidos: el botón vuelve a estar disponible tras 30 s
        btn.textContent = 'Enlace enviado';
        setTimeout(() => { btn.disabled = false; btn.textContent = 'Enviar enlace'; }, 30000);
        btn.classList.remove('btn-loading');
        return;
      } catch {
        showError('Error de conexión con el servidor');
      }
      btn.classList.remove('btn-loading');
      btn.disabled = false;
    });
  </script>
</body>
</html>
