<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — AGENDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --p: #4f46e5; --p-light: #eef2ff;
      --surface: #f8f7ff; --border: #e5e3ff;
      --text: #1e1b4b; --muted: #6b7280;
    }
    body { background: var(--surface); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); }
    .topbar { background: var(--p); color: white; padding: .85rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .topbar h1 { font-size: 1.1rem; font-weight: 700; margin: 0; }
    .nav-tabs-admin { display: flex; gap: .5rem; padding: 1.25rem 1.5rem .5rem; flex-wrap: wrap; }
    .nav-tab { background: white; border: 1px solid var(--border); border-radius: 8px; padding: .45rem 1.1rem; font-size: .875rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s; text-decoration: none; }
    .nav-tab:hover, .nav-tab.active { background: var(--p); color: white; border-color: var(--p); }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .metric-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; text-align: center; }
    .metric-value { font-size: 2rem; font-weight: 800; color: var(--p); line-height: 1; }
    .metric-value.yellow { color: #d97706; }
    .metric-value.green  { color: #059669; }
    .metric-value.red    { color: #dc2626; }
    .metric-label { font-size: .75rem; color: var(--muted); margin-top: .3rem; text-transform: uppercase; letter-spacing: .05em; }
    .chart-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: .5rem; }
    .chart-title { font-weight: 700; font-size: 1rem; margin: 0; }
    .period-btn { border: 1px solid var(--border); background: white; border-radius: 6px; padding: .3rem .75rem; font-size: .78rem; font-weight: 600; color: var(--muted); cursor: pointer; }
    .period-btn.active { background: var(--p); border-color: var(--p); color: white; }
    .btn-logout { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: white; border-radius: 8px; padding: .3rem .85rem; font-size: .8rem; font-weight: 600; cursor: pointer; }
    .top-service-row { display: flex; align-items: center; gap: .75rem; padding: .6rem 0; border-bottom: 1px solid var(--border); }
    .top-service-row:last-child { border: none; }
    .top-service-rank { width: 24px; height: 24px; background: var(--p-light); color: var(--p); border-radius: 50%; font-size: .75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .top-service-name { flex: 1; font-size: .9rem; font-weight: 600; }
    .top-service-count { font-size: .85rem; color: var(--muted); }
    .bar-fill { height: 6px; background: var(--p); border-radius: 4px; margin-top: .25rem; transition: width .4s; }
  </style>
  <script src="config.js"></script>
  <link rel="icon" type="image/png" href="assets/icon.png">
</head>
<body>

<div class="topbar">
  <h1 style="margin:0;"><img src="assets/logo-white.png" alt="Agendly" style="height:24px;width:auto;display:block;"></h1>
  <div style="display:flex;align-items:center;gap:1rem;">
    <span id="topbar-name" style="font-size:.85rem;opacity:.85;"></span>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<!-- Navegación entre secciones del panel -->
<div class="nav-tabs-admin">
  <a href="#" class="nav-tab active" onclick="showSection('dashboard', this)">Dashboard</a>
  <a href="#" class="nav-tab" onclick="showSection('services', this)">Servicios</a>
  <a href="#" class="nav-tab" onclick="showSection('professionals', this)">Profesionales</a>
  <a href="#" class="nav-tab" onclick="showSection('schedules', this)">Horarios</a>
  <a href="admin.html" class="nav-tab">Reservas</a>
</div>

<div class="container-fluid px-4 pb-5" style="max-width:1100px;">

  <!-- ═══ SECCIÓN DASHBOARD ═══ -->
  <div id="section-dashboard">
    <div class="metric-grid" id="metrics-grid">
      <!-- Renderizado por JS -->
    </div>
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="chart-card">
          <div class="chart-header">
            <p class="chart-title">Reservas por período</p>
            <div style="display:flex;gap:.35rem;">
              <button class="period-btn active" onclick="changePeriod('day',this)">Días</button>
              <button class="period-btn" onclick="changePeriod('week',this)">Semanas</button>
              <button class="period-btn" onclick="changePeriod('month',this)">Meses</button>
            </div>
          </div>
          <canvas id="chart-period" height="220"></canvas>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="chart-card" style="height:100%;">
          <p class="chart-title" style="margin-bottom:1rem;">Top servicios</p>
          <div id="top-services-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ SECCIÓN SERVICIOS ═══ -->
  <div id="section-services" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:1.25rem 0 1rem;">
      <h2 style="font-size:1.1rem;font-weight:700;margin:0;">Servicios</h2>
      <button class="btn btn-primary btn-sm" onclick="openServiceModal()">+ Nuevo servicio</button>
    </div>
    <div id="services-table"></div>
  </div>

  <!-- ═══ SECCIÓN PROFESIONALES ═══ -->
  <div id="section-professionals" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:1.25rem 0 1rem;">
      <h2 style="font-size:1.1rem;font-weight:700;margin:0;">Profesionales</h2>
      <button class="btn btn-primary btn-sm" onclick="openProModal()">+ Nuevo profesional</button>
    </div>
    <div id="professionals-table"></div>
  </div>

  <!-- ═══ SECCIÓN HORARIOS ═══ -->
  <div id="section-schedules" style="display:none;">
    <div style="margin:1.25rem 0 1rem;">
      <h2 style="font-size:1.1rem;font-weight:700;margin:0 0 .75rem;">Horarios de trabajo</h2>
      <select id="schedule-pro-select" class="form-select" style="max-width:280px;"
              onchange="loadSchedules(this.value)">
        <option value="">Selecciona un profesional</option>
      </select>
    </div>
    <div id="schedules-editor"></div>
  </div>

</div>

<!-- ═══ MODAL SERVICIO ═══ -->
<div class="modal fade" id="serviceModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="serviceModalTitle">Nuevo servicio</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="svc-id"/>
        <div class="mb-3">
          <label class="form-label fw-semibold">Nombre *</label>
          <input type="text" id="svc-name" class="form-control" placeholder="Corte de cabello"/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Descripción</label>
          <input type="text" id="svc-desc" class="form-control" placeholder="Descripción opcional"/>
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label fw-semibold">Duración (min) *</label>
            <input type="number" id="svc-duration" class="form-control" min="5" placeholder="30"/>
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold">Precio (CLP)</label>
            <input type="number" id="svc-price" class="form-control" min="0" placeholder="8000"/>
          </div>
        </div>
        <div id="svc-error" class="text-danger mt-2" style="font-size:.85rem;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="saveService()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ MODAL PROFESIONAL ═══ -->
<div class="modal fade" id="proModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="proModalTitle">Nuevo profesional</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="pro-id"/>
        <div class="mb-3">
          <label class="form-label fw-semibold">Nombre *</label>
          <input type="text" id="pro-name" class="form-control"/>
        </div>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" id="pro-email" class="form-control"/>
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold">Teléfono</label>
            <input type="tel" id="pro-phone" class="form-control"/>
          </div>
        </div>
        <div class="mb-3 mt-2">
          <label class="form-label fw-semibold">Bio</label>
          <textarea id="pro-bio" class="form-control" rows="2"></textarea>
        </div>
        <div id="pro-error" class="text-danger" style="font-size:.85rem;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="saveProfessional()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ════════════════════════════════════════════════════════
//  CONFIG Y SESIÓN
// ════════════════════════════════════════════════════════

const API  = AGENDLY_API;
const TOKEN = sessionStorage.getItem('agendly_token');
const SLUG  = new URLSearchParams(location.search).get('negocio')
           || sessionStorage.getItem('agendly_slug');

if (!TOKEN) location.href = 'login.html';

document.getElementById('topbar-name').textContent =
  sessionStorage.getItem('agendly_email') ?? '';

function authH() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` };
}

async function apiFetch(path, opts = {}) {
  const res  = await fetch(`${API}${path}`, { ...opts, headers: authH() });
  const json = await res.json();
  if (res.status === 401) { sessionStorage.clear(); location.href = 'login.html'; }
  if (!res.ok) throw new Error(json.error || 'Error del servidor');
  return json.data ?? json;
}

function logout() { sessionStorage.clear(); location.href = 'login.html'; }

// ════════════════════════════════════════════════════════
//  NAVEGACIÓN ENTRE SECCIONES
// ════════════════════════════════════════════════════════

const sections = ['dashboard', 'services', 'professionals', 'schedules'];

function showSection(name, tab) {
  sections.forEach(s => {
    document.getElementById(`section-${s}`).style.display = s === name ? 'block' : 'none';
  });
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  if (tab) tab.classList.add('active');

  // Cargar datos de la sección al mostrarla
  if (name === 'services')       loadServicesTable();
  if (name === 'professionals')  loadProfessionalsTable();
  if (name === 'schedules')      loadSchedulesProfessionals();
}

// ════════════════════════════════════════════════════════
//  DASHBOARD — MÉTRICAS
// ════════════════════════════════════════════════════════

let periodChart = null;

async function loadDashboard() {
  const [summary, topServices] = await Promise.all([
    apiFetch(`/api/dashboard/${SLUG}/summary`),
    apiFetch(`/api/dashboard/${SLUG}/top-services`),
  ]);

  renderMetrics(summary);
  renderTopServices(topServices);
  await loadPeriodChart('day');
}

function renderMetrics(s) {
  const fmt = n => new Intl.NumberFormat('es-CL').format(n);
  const fmtCLP = n => new Intl.NumberFormat('es-CL',
    { style:'currency', currency:'CLP', maximumFractionDigits: 0 }).format(n);

  document.getElementById('metrics-grid').innerHTML = `
    <div class="metric-card">
      <div class="metric-value">${s.total}</div>
      <div class="metric-label">Total reservas</div>
    </div>
    <div class="metric-card">
      <div class="metric-value yellow">${s.pending}</div>
      <div class="metric-label">Pendientes</div>
    </div>
    <div class="metric-card">
      <div class="metric-value" style="color:#1d4ed8;">${s.confirmed}</div>
      <div class="metric-label">Confirmadas</div>
    </div>
    <div class="metric-card">
      <div class="metric-value green">${s.completed}</div>
      <div class="metric-label">Completadas</div>
    </div>
    <div class="metric-card">
      <div class="metric-value red">${s.cancellation_rate}%</div>
      <div class="metric-label">Tasa cancelación</div>
    </div>
    <div class="metric-card">
      <div class="metric-value" style="color:#059669;font-size:1.4rem;">
        ${fmtCLP(s.estimated_revenue)}
      </div>
      <div class="metric-label">Ingresos estimados</div>
    </div>
    <div class="metric-card">
      <div class="metric-value" style="font-size:1.5rem;">${s.last_30_days}</div>
      <div class="metric-label">Últimos 30 días</div>
    </div>`;
}

function renderTopServices(services) {
  const max = services[0]?.count || 1;
  document.getElementById('top-services-list').innerHTML =
    services.length === 0
      ? '<p style="color:var(--muted);font-size:.9rem;">Sin datos aún</p>'
      : services.map((s, i) => `
        <div class="top-service-row">
          <div class="top-service-rank">${i + 1}</div>
          <div style="flex:1;">
            <div class="top-service-name">${esc(s.name)}</div>
            <div class="bar-fill" style="width:${Math.round(s.count/max*100)}%"></div>
          </div>
          <div class="top-service-count">${s.count} reservas</div>
        </div>`).join('');
}

async function loadPeriodChart(period) {
  const data = await apiFetch(`/api/dashboard/${SLUG}/by-period?period=${period}&limit=14`);

  const labels = data.map(d => d.period);
  const totals = data.map(d => d.total);

  if (periodChart) periodChart.destroy();

  periodChart = new Chart(document.getElementById('chart-period'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Reservas',
        data: totals,
        backgroundColor: 'rgba(79, 70, 229, 0.75)',
        borderRadius: 6,
        borderSkipped: false,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { precision: 0 },
          grid: { color: 'rgba(0,0,0,0.04)' },
        },
        x: { grid: { display: false } },
      },
    },
  });
}

function changePeriod(period, btn) {
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadPeriodChart(period);
}

// ════════════════════════════════════════════════════════
//  GESTIÓN DE SERVICIOS
// ════════════════════════════════════════════════════════

let svcModal;

async function loadServicesTable() {
  const data = await apiFetch(`/api/admin/${SLUG}/services`);
  const fmtCLP = n => new Intl.NumberFormat('es-CL',
    { style:'currency', currency:'CLP', maximumFractionDigits: 0 }).format(n);

  document.getElementById('services-table').innerHTML =
    data.length === 0
      ? '<p class="text-muted">No hay servicios. Crea el primero.</p>'
      : `<div class="table-responsive">
          <table class="table bg-white rounded" style="border:1px solid var(--border);">
            <thead style="background:#f5f4ff;">
              <tr>
                <th>Nombre</th><th>Duración</th><th>Precio</th><th>Estado</th><th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${data.map(s => `
                <tr>
                  <td><strong>${esc(s.name)}</strong>${s.description ? `<br><small class="text-muted">${esc(s.description)}</small>` : ''}</td>
                  <td>${s.duration_min} min</td>
                  <td>${fmtCLP(s.price)}</td>
                  <td>
                    <span class="badge ${s.is_active ? 'bg-success' : 'bg-secondary'}">
                      ${s.is_active ? 'Activo' : 'Inactivo'}
                    </span>
                  </td>
                  <td>
                    <button class="btn btn-sm btn-outline-primary me-1"
                            onclick="openServiceModal(${esc(JSON.stringify(s))})">
                      Editar
                    </button>
                    <button class="btn btn-sm ${s.is_active ? 'btn-outline-danger' : 'btn-outline-success'}"
                            onclick="toggleService('${s.id}', ${!s.is_active})">
                      ${s.is_active ? 'Desactivar' : 'Activar'}
                    </button>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
}

function openServiceModal(svc = null) {
  document.getElementById('svc-id').value      = svc?.id ?? '';
  document.getElementById('svc-name').value    = svc?.name ?? '';
  document.getElementById('svc-desc').value    = svc?.description ?? '';
  document.getElementById('svc-duration').value = svc?.duration_min ?? '';
  document.getElementById('svc-price').value   = svc?.price ?? '';
  document.getElementById('svc-error').textContent = '';
  document.getElementById('serviceModalTitle').textContent =
    svc ? 'Editar servicio' : 'Nuevo servicio';
  svcModal = svcModal || new bootstrap.Modal(document.getElementById('serviceModal'));
  svcModal.show();
}

async function saveService() {
  const id       = document.getElementById('svc-id').value;
  const name     = document.getElementById('svc-name').value.trim();
  const duration = parseInt(document.getElementById('svc-duration').value);
  const price    = parseFloat(document.getElementById('svc-price').value) || 0;
  const desc     = document.getElementById('svc-desc').value.trim();
  const errEl    = document.getElementById('svc-error');

  if (!name)         return errEl.textContent = 'El nombre es requerido';
  if (duration < 5)  return errEl.textContent = 'La duración mínima es 5 minutos';

  try {
    const path   = id
      ? `/api/admin/${SLUG}/services/${id}`
      : `/api/admin/${SLUG}/services`;
    const method = id ? 'PATCH' : 'POST';

    await apiFetch(path, {
      method,
      body: JSON.stringify({ name, description: desc, duration_min: duration, price }),
    });

    svcModal.hide();
    loadServicesTable();
  } catch (err) {
    errEl.textContent = err.message;
  }
}

async function toggleService(id, newState) {
  await apiFetch(`/api/admin/${SLUG}/services/${id}`, {
    method: 'PATCH',
    body:   JSON.stringify({ is_active: newState }),
  });
  loadServicesTable();
}

// ════════════════════════════════════════════════════════
//  GESTIÓN DE PROFESIONALES
// ════════════════════════════════════════════════════════

let proModal;

async function loadProfessionalsTable() {
  const data = await apiFetch(`/api/admin/${SLUG}/professionals`);

  document.getElementById('professionals-table').innerHTML =
    data.length === 0
      ? '<p class="text-muted">No hay profesionales. Crea el primero.</p>'
      : `<div class="table-responsive">
          <table class="table bg-white rounded" style="border:1px solid var(--border);">
            <thead style="background:#f5f4ff;">
              <tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody>
              ${data.map(p => `
                <tr>
                  <td><strong>${esc(p.name)}</strong>${p.bio ? `<br><small class="text-muted">${esc(p.bio)}</small>` : ''}</td>
                  <td>${esc(p.email ?? '—')}</td>
                  <td>${esc(p.phone ?? '—')}</td>
                  <td>
                    <span class="badge ${p.is_active ? 'bg-success' : 'bg-secondary'}">
                      ${p.is_active ? 'Activo' : 'Inactivo'}
                    </span>
                  </td>
                  <td>
                    <button class="btn btn-sm btn-outline-primary me-1"
                            onclick="openProModal(${esc(JSON.stringify(p))})">
                      Editar
                    </button>
                    <button class="btn btn-sm ${p.is_active ? 'btn-outline-danger' : 'btn-outline-success'}"
                            onclick="togglePro('${p.id}', ${!p.is_active})">
                      ${p.is_active ? 'Desactivar' : 'Activar'}
                    </button>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
}

function openProModal(pro = null) {
  document.getElementById('pro-id').value    = pro?.id ?? '';
  document.getElementById('pro-name').value  = pro?.name ?? '';
  document.getElementById('pro-email').value = pro?.email ?? '';
  document.getElementById('pro-phone').value = pro?.phone ?? '';
  document.getElementById('pro-bio').value   = pro?.bio ?? '';
  document.getElementById('pro-error').textContent = '';
  document.getElementById('proModalTitle').textContent =
    pro ? 'Editar profesional' : 'Nuevo profesional';
  proModal = proModal || new bootstrap.Modal(document.getElementById('proModal'));
  proModal.show();
}

async function saveProfessional() {
  const id    = document.getElementById('pro-id').value;
  const name  = document.getElementById('pro-name').value.trim();
  const email = document.getElementById('pro-email').value.trim();
  const phone = document.getElementById('pro-phone').value.trim();
  const bio   = document.getElementById('pro-bio').value.trim();
  const errEl = document.getElementById('pro-error');

  if (!name) return errEl.textContent = 'El nombre es requerido';

  try {
    await apiFetch(
      id ? `/api/admin/${SLUG}/professionals/${id}` : `/api/admin/${SLUG}/professionals`,
      { method: id ? 'PATCH' : 'POST', body: JSON.stringify({ name, email, phone, bio }) }
    );
    proModal.hide();
    loadProfessionalsTable();
  } catch (err) {
    errEl.textContent = err.message;
  }
}

async function togglePro(id, newState) {
  await apiFetch(`/api/admin/${SLUG}/professionals/${id}`, {
    method: 'PATCH',
    body:   JSON.stringify({ is_active: newState }),
  });
  loadProfessionalsTable();
}

// ════════════════════════════════════════════════════════
//  GESTIÓN DE HORARIOS
// ════════════════════════════════════════════════════════

const DAY_NAMES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

async function loadSchedulesProfessionals() {
  const data = await apiFetch(`/api/admin/${SLUG}/professionals`);
  const sel  = document.getElementById('schedule-pro-select');
  sel.innerHTML = '<option value="">Selecciona un profesional</option>' +
    data.filter(p => p.is_active)
        .map(p => `<option value="${p.id}">${esc(p.name)}</option>`)
        .join('');
  document.getElementById('schedules-editor').innerHTML = '';
}

async function loadSchedules(professionalId) {
  if (!professionalId) {
    document.getElementById('schedules-editor').innerHTML = '';
    return;
  }

  const current = await apiFetch(
    `/api/admin/${SLUG}/schedules/${professionalId}`
  );

  // Construir mapa día → horario existente
  const existing = {};
  current.forEach(s => { existing[s.day_of_week] = s; });

  // Renderizar los 7 días como filas editables
  document.getElementById('schedules-editor').innerHTML = `
    <div class="chart-card">
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:1rem;">
        Activa los días que trabaja el profesional y define su horario.
      </p>
      ${[1,2,3,4,5,6,0].map(day => {
        const has = !!existing[day];
        return `
          <div class="d-flex align-items-center gap-3 py-2"
               style="border-bottom:1px solid var(--border);" id="day-row-${day}">
            <div style="width:110px;">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="day-active-${day}"
                       ${has ? 'checked' : ''}
                       onchange="toggleDayRow(${day}, this.checked)"/>
                <label class="form-check-label fw-semibold" for="day-active-${day}">
                  ${DAY_NAMES[day]}
                </label>
              </div>
            </div>
            <div id="day-inputs-${day}"
                 style="display:${has ? 'flex' : 'none'};gap:.5rem;align-items:center;">
              <input type="time" id="day-start-${day}" value="${existing[day]?.start_time ?? '09:00'}"
                     class="form-control form-control-sm" style="width:110px;"/>
              <span style="color:var(--muted);">a</span>
              <input type="time" id="day-end-${day}" value="${existing[day]?.end_time ?? '18:00'}"
                     class="form-control form-control-sm" style="width:110px;"/>
            </div>
          </div>`;
      }).join('')}
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary btn-sm"
                onclick="saveSchedules('${professionalId}')">
          Guardar horarios
        </button>
        <span id="schedule-msg" style="font-size:.85rem;color:var(--muted);line-height:2;"></span>
      </div>
    </div>`;
}

function toggleDayRow(day, active) {
  document.getElementById(`day-inputs-${day}`).style.display = active ? 'flex' : 'none';
}

async function saveSchedules(professionalId) {
  const schedules = [];
  for (let day = 0; day <= 6; day++) {
    const active = document.getElementById(`day-active-${day}`)?.checked;
    if (!active) continue;
    schedules.push({
      day_of_week: day,
      start_time:  document.getElementById(`day-start-${day}`).value,
      end_time:    document.getElementById(`day-end-${day}`).value,
    });
  }

  const msgEl = document.getElementById('schedule-msg');
  try {
    await apiFetch(`/api/admin/${SLUG}/schedules/${professionalId}`, {
      method: 'PUT',
      body:   JSON.stringify({ schedules }),
    });
    msgEl.textContent = '✓ Horarios guardados correctamente';
    msgEl.style.color = 'var(--p)';
  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.style.color = '#dc2626';
  }
}
