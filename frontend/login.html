<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión — AGENDLY</title>
  <link rel="stylesheet" href="styles/design-system.css?v=0c902f78"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
  <style>
    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* Panel derecho */
    .form-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      overflow-y: auto;
    }
    .form-box {
      width: 100%;
      max-width: 400px;
    }
    .form-heading {
      margin-bottom: 32px;
    }
    .form-heading h2 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-primary);
    }
    .form-heading p {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .fgroup {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 16px;
    }
    .flabel {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap .form-input {
      padding-right: 42px;
    }
    .toggle-pw {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      font-size: 17px;
      padding: 10px;
      margin-right: -6px;
      transition: color var(--transition-fast);
    }
    .toggle-pw:hover { color: var(--text-secondary); }
    .form-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 22px;
    }
    .form-footer a {
      color: var(--brand-primary);
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      padding: 8px 4px;
    }
    .form-footer a:hover { text-decoration: underline; }

    .forgot-link {
      align-self: flex-end;
      padding: 10px 2px 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-primary);
      text-decoration: none;
    }
    .forgot-link:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .form-panel { padding: 32px 24px; align-items: flex-start; padding-top: 52px; }
    }
  </style>
  <script src="config.js?v=7a999ca1"></script>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="styles/auth.css?v=8f0a8457"/>
</head>
<body>

  <header class="ob-topbar">
    <a href="index.html" class="ob-logo" aria-label="Agendly"><img src="assets/logo.png" alt="Agendly" style="height:28px;width:auto;display:block;"></a>
    <div class="ob-top-right"><span class="ob-top-q">¿Nuevo en Agendly?</span><a href="register.html" class="ob-top-cta">Crear cuenta</a></div>
  </header>

  <div class="form-panel">
    <div class="form-box animate-in">

      <div class="form-heading">
        <h2>Bienvenido de nuevo</h2>
        <p>Ingresa a tu panel de administración.</p>
      </div>

      <div class="alert alert-error mb-4" id="login-error">
        <span id="login-error-text"></span>
      </div>

      <form id="login-form" novalidate>
        <div class="fgroup">
          <label class="flabel" for="email">Email</label>
          <input type="email" id="email" class="form-input"
                 placeholder="tu@email.com" autocomplete="email"/>
        </div>

        <div class="fgroup" style="margin-bottom:24px;">
          <label class="flabel" for="password">Contraseña</label>
          <div class="input-wrap">
            <input type="password" id="password" class="form-input"
                   placeholder="Tu contraseña" autocomplete="current-password"/>
            <button type="button" class="toggle-pw"
                    onclick="togglePw()" aria-label="Mostrar contraseña">
              <i id="pw-icon" class="ti ti-eye"></i>
            </button>
          </div>
          <a href="forgot-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary btn-lg btn-full">
          Iniciar sesión
        </button>
      </form>

      <div class="form-footer">
        ¿No tienes cuenta?
        <a href="register.html">Crear cuenta gratis</a>
      </div>

    </div>
  </div>

  <script>
    const API = AGENDLY_API;

    if (sessionStorage.getItem('agendly_token')) {
      const slug = sessionStorage.getItem('agendly_slug');
      window.location.href = slug ? `app.html?negocio=${encodeURIComponent(slug)}` : 'onboarding.html';
    }

    function togglePw() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('pw-icon');
      input.type  = input.type === 'password' ? 'text' : 'password';
      icon.className = input.type === 'password' ? 'ti ti-eye' : 'ti ti-eye-off';
    }

    function showError(msg) {
      document.getElementById('login-error-text').textContent = msg;
      document.getElementById('login-error').classList.add('visible');
    }
    function hideError() {
      document.getElementById('login-error').classList.remove('visible');
    }

    document.getElementById('email').addEventListener('input', hideError);
    document.getElementById('password').addEventListener('input', hideError);

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      hideError();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Completa todos los campos');
        return;
      }

      const btn = document.getElementById('btn-login');
      btn.classList.add('btn-loading');
      btn.disabled = true;

      try {
        const res  = await fetch(`${API}/api/auth/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password }),
        });
        const json = await res.json();

        if (!res.ok) {
          showError(json.error || 'Email o contraseña incorrectos');
          return;
        }

        sessionStorage.setItem('agendly_token',   json.access_token);
        sessionStorage.setItem('agendly_email',   json.user.email);
        sessionStorage.setItem('agendly_user_id', json.user.id);

        // Verificar si ya tiene negocio
        const bizRes  = await fetch(`${API}/api/auth/my-business`, {
          headers: { 'Authorization': `Bearer ${json.access_token}` },
        });

        if (bizRes.ok) {
          const bizJson = await bizRes.json();
          sessionStorage.setItem('agendly_slug', bizJson.data.slug);
          window.location.href = `app.html?negocio=${bizJson.data.slug}`;
        } else {
          window.location.href = 'onboarding.html';
        }

      } catch {
        showError('Error de conexión con el servidor');
      } finally {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-form').requestSubmit();
    });
  </script>
</body>
</html>
