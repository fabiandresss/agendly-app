<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGENDLY – Reserva tu hora</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    /* Variables de color de AGENDLY */
    :root {
      --agendly-primary:   #4f46e5;
      --agendly-primary-hover: #4338ca;
      --agendly-surface:   #f8f7ff;
      --agendly-card:      #ffffff;
      --agendly-border:    #e5e3ff;
      --agendly-text:      #1e1b4b;
      --agendly-muted:     #6b7280;
      --agendly-success:   #059669;
      --agendly-error:     #dc2626;
    }

    body {
      background-color: var(--agendly-surface);
      color: var(--agendly-text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header del negocio ── */
    #business-header {
      background: var(--agendly-primary);
      color: white;
      padding: 2.5rem 0 2rem;
      text-align: center;
    }
    #business-header h1 { font-size: 2rem; font-weight: 700; margin: 0; }
    #business-header p  { opacity: 0.85; margin: 0.4rem 0 0; font-size: 1rem; }

    /* ── Tarjetas de servicio y profesional ── */
    .option-card {
      border: 2px solid var(--agendly-border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: var(--agendly-card);
      user-select: none;
    }
    .option-card:hover  { border-color: var(--agendly-primary); }
    .option-card.selected {
      border-color: var(--agendly-primary);
      background: var(--agendly-surface);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    }
    .option-card .card-title  { font-weight: 600; margin: 0 0 0.2rem; font-size: 1rem; }
    .option-card .card-detail { color: var(--agendly-muted); font-size: 0.875rem; margin: 0; }
    .option-card .card-price  {
      font-weight: 700;
      color: var(--agendly-primary);
      font-size: 0.95rem;
      margin-top: 0.3rem;
    }

    /* ── Pasos del formulario ── */
    .step-section {
      background: var(--agendly-card);
      border-radius: 16px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--agendly-border);
    }
    .step-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--agendly-primary);
      margin-bottom: 0.35rem;
    }
    .step-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 1.25rem;
      color: var(--agendly-text);
    }

    /* ── Botón principal ── */
    .btn-agendly {
      background: var(--agendly-primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-agendly:hover:not(:disabled) { background: var(--agendly-primary-hover); }
    .btn-agendly:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* ── Pantalla de confirmación ── */
    #confirmation-screen {
      display: none;
      text-align: center;
      padding: 3rem 1rem;
    }
    .confirm-icon {
      width: 72px; height: 72px;
      background: #d1fae5;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }
    .confirm-icon svg { color: var(--agendly-success); }

    /* ── Estados de carga y error ── */
    .skeleton {
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
      height: 80px;
      margin-bottom: 0.75rem;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    #error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: var(--agendly-error);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    #submit-error {
      display: none;
      color: var(--agendly-error);
      font-size: 0.875rem;
      margin-top: 0.75rem;
      text-align: center;
    }

    /* Inputs del formulario */
    .form-control, .form-select {
      border-color: var(--agendly-border);
      border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--agendly-primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
    }

    #slots-container button.active {
  background-color: var(--agendly-primary);
  color: white;
  border-color: var(--agendly-primary);
}
  </style>
</head>

<body>

  <!-- ═══════════════════════════════════════
       HEADER: nombre y datos del negocio
  ════════════════════════════════════════ -->
  <div id="business-header">
    <div class="container">
      <h1 id="business-name">Cargando...</h1>
      <p  id="business-info"></p>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       CONTENIDO PRINCIPAL
  ════════════════════════════════════════ -->
  <div class="container py-4" style="max-width: 680px;">

    <!-- Banner de error global (negocio no encontrado, etc.) -->
    <div id="error-banner"></div>

    <!-- ── FORMULARIO DE RESERVA ── -->
    <div id="booking-form">

      <!-- PASO 1: Elegir servicio -->
      <div class="step-section">
        <p class="step-label">Paso 1</p>
        <h2 class="step-title">¿Qué servicio necesitas?</h2>
        <div id="services-list">
          <!-- Skeletons de carga -->
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </div>

      <!-- PASO 2: Elegir profesional -->
      <div class="step-section">
        <p class="step-label">Paso 2</p>
        <h2 class="step-title">¿Con quién quieres atenderte?</h2>
        <div id="professionals-list">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </div>

      <!-- PASO 3: Elegir fecha y hora -->
      <div class="step-section">
        <p class="step-label">Paso 3</p>
        <h2 class="step-title">¿Cuándo quieres tu hora?</h2>
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label fw-semibold" for="input-date">Fecha</label>
            <input type="date" id="input-date" class="form-control" />
          </div>
          <div class="col-12">
  <label class="form-label fw-semibold">Horarios disponibles</label>
  <div id="slots-container" class="d-flex flex-wrap gap-2">
    <p class="text-muted">Selecciona fecha y profesional</p>
  </div>
</div>
        </div>
      </div>

      <!-- PASO 4: Datos del cliente -->
      <div class="step-section">
        <p class="step-label">Paso 4</p>
        <h2 class="step-title">Tus datos de contacto</h2>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold" for="input-name">Nombre completo *</label>
            <input type="text" id="input-name" class="form-control" placeholder="Juan Pérez" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="input-phone">Teléfono *</label>
            <input type="tel" id="input-phone" class="form-control" placeholder="+56912345678" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="input-email">Email (opcional)</label>
            <input type="email" id="input-email" class="form-control" placeholder="juan@email.com" />
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold" for="input-notes">Notas (opcional)</label>
            <textarea id="input-notes" class="form-control" rows="2"
              placeholder="Ej: prefiero corte con tijera"></textarea>
          </div>
        </div>
      </div>

      <!-- BOTÓN DE ENVÍO -->
      <button id="btn-submit" class="btn-agendly" disabled>
        Confirmar reserva
      </button>
      <div id="submit-error"></div>

    </div><!-- /booking-form -->

    <!-- ── PANTALLA DE CONFIRMACIÓN (se muestra luego del POST) ── -->
    <div id="confirmation-screen">
      <div class="confirm-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2 style="font-weight:700; font-size:1.5rem;">¡Reserva confirmada!</h2>
      <p id="confirm-detail" style="color:var(--agendly-muted); margin: 0.5rem 0 2rem;"></p>
      <button class="btn-agendly" style="max-width:280px;"
              onclick="location.reload()">Hacer otra reserva</button>
    </div>

  </div><!-- /container -->

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ═══════════════════════════════════════════════════════
    //  AGENDLY — Lógica del formulario de reserva
    // ═══════════════════════════════════════════════════════

    // ── Configuración ──
    const API_BASE = 'http://localhost:3000';

    // ── Estado de la selección del usuario ──
const state = {
  business: null,
  selectedService: null,
  selectedPro: null,
  selectedTime: null, // 🔥 IMPORTANTE
};
    // ── Referencias a elementos del DOM ──
    const els = {
      businessName:      document.getElementById('business-name'),
      businessInfo:      document.getElementById('business-info'),
      servicesList:      document.getElementById('services-list'),
      professionalsList: document.getElementById('professionals-list'),
      errorBanner:       document.getElementById('error-banner'),
      btnSubmit:         document.getElementById('btn-submit'),
      submitError:       document.getElementById('submit-error'),
      bookingForm:       document.getElementById('booking-form'),
      confirmScreen:     document.getElementById('confirmation-screen'),
      confirmDetail:     document.getElementById('confirm-detail'),
      inputDate:         document.getElementById('input-date'),
      inputTime:         document.getElementById('input-time'),
      inputName:         document.getElementById('input-name'),
      inputPhone:        document.getElementById('input-phone'),
      inputEmail:        document.getElementById('input-email'),
      inputNotes:        document.getElementById('input-notes'),
      slotsContainer: document.getElementById('slots-container'),
    };

    // ════════════════════════════════════════════════════════
    //  UTILIDADES
    // ════════════════════════════════════════════════════════

    /** Muestra un error global en el banner superior */
    function showError(msg) {
      els.errorBanner.textContent = msg;
      els.errorBanner.style.display = 'block';
    }

    /** Formatea precio en pesos chilenos */
    function formatPrice(amount) {
      return new Intl.NumberFormat('es-CL', {
        style: 'currency', currency: 'CLP', maximumFractionDigits: 0
      }).format(amount);
    }

    /** Formatea fecha/hora legible para la confirmación */
    function formatDateTime(isoString) {
      return new Date(isoString).toLocaleString('es-CL', {
        weekday: 'long', day: 'numeric', month: 'long',
        hour: '2-digit', minute: '2-digit'
      });
    }

    /** Obtiene el slug de ?negocio=xxx en la URL */
    function getSlugFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get('negocio');
    }

    /** Activa o desactiva el botón de envío según si todo está completo */
    function updateSubmitButton() {
      const allSelected =
        state.selectedService &&
        state.selectedPro &&
        els.inputDate.value &&
        state.selectedTime &&
        els.inputName.value.trim() &&
        els.inputPhone.value.trim();

      els.btnSubmit.disabled = !allSelected;
    }

    // ════════════════════════════════════════════════════════
    //  RENDERIZADO DE TARJETAS
    // ════════════════════════════════════════════════════════

    /**
     * Crea una tarjeta de opción (servicio o profesional).
     * Al hacer clic actualiza el estado y marca la tarjeta como seleccionada.
     */
    function renderOptionCard(container, item, type) {
      const card = document.createElement('div');
      card.className = 'option-card mb-2';
      card.dataset.id = item.id;

      if (type === 'service') {
        card.innerHTML = `
          <p class="card-title">${item.name}</p>
          <p class="card-detail">${item.duration_min} minutos</p>
          <p class="card-price">${formatPrice(item.price)}</p>
        `;
        card.addEventListener('click', () => {
          // Quitar selección anterior
          container.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          state.selectedService = item;
          state.selectedTime = null; // resetear hora
          loadAvailableSlots();      // 🔥 cargar horarios
          updateSubmitButton();
        });
      }

      if (type === 'professional') {
        card.innerHTML = `
          <p class="card-title">${item.name}</p>
          ${item.bio ? `<p class="card-detail">${item.bio}</p>` : ''}
        `;
        card.addEventListener('click', () => {
          container.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          state.selectedPro = item;
          state.selectedTime = null;
          loadAvailableSlots();
          updateSubmitButton();
        });
      }

      container.appendChild(card);
    }

    // ════════════════════════════════════════════════════════
    //  LLAMADAS A LA API
    // ════════════════════════════════════════════════════════

    /** Carga el negocio y sus datos desde el backend */
    async function loadBusiness(slug) {
      const res  = await fetch(`${API_BASE}/api/businesses/${slug}`);
      const json = await res.json();

      if (!res.ok) throw new Error(json.error || 'Negocio no encontrado');
      return json.data;
    }

    /** Carga los servicios del negocio */
    async function loadServices(slug) {
      const res  = await fetch(`${API_BASE}/api/businesses/${slug}/services`);
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Error al cargar servicios');
      return json.data;
    }

    /** Carga los profesionales del negocio */
    async function loadProfessionals(slug) {
      const res  = await fetch(`${API_BASE}/api/businesses/${slug}/professionals`);
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Error al cargar profesionales');
      return json.data;
    }

    async function loadAvailableSlots() {
      if (!state.selectedService || !state.selectedPro || !els.inputDate.value) {
  els.slotsContainer.innerHTML =
    '<p class="text-muted">Selecciona servicio, profesional y fecha</p>';
  return;
}
  // 1. Validar que todo esté seleccionado
  if (!state.selectedService || !state.selectedPro || !els.inputDate.value) {
    return;
  }

  // 2. Construir URL
  const url = new URL(`${API_BASE}/api/availability`);
  url.searchParams.set('businessSlug', state.business.slug);
  url.searchParams.set('professionalId', state.selectedPro.id);
  url.searchParams.set('serviceId', state.selectedService.id);
  url.searchParams.set('date', els.inputDate.value);

  // 3. Mostrar loading
  els.slotsContainer.innerHTML = '<p class="text-muted">Cargando horarios...</p>';

  try {
    // 4. Llamada al backend
    const res = await fetch(url);
    const json = await res.json();

    // 5. Si no hay horarios
    if (!res.ok || !json.available) {
      els.slotsContainer.innerHTML =
        '<p class="text-danger">No hay horarios disponibles</p>';
      return;
    }

    // 6. Renderizar botones
    renderSlots(json.slots);

  } catch (err) {
    els.slotsContainer.innerHTML =
      '<p class="text-danger">Error al cargar horarios</p>';
  }
}

function renderSlots(slots) {
  // limpiar contenedor
  els.slotsContainer.innerHTML = '';

  slots.forEach(time => {
    const btn = document.createElement('button');

    btn.className = 'btn btn-outline-primary btn-sm';
    btn.textContent = time;

    btn.addEventListener('click', () => {

      // 1. quitar selección anterior
      document.querySelectorAll('#slots-container button')
        .forEach(b => b.classList.remove('active'));

      // 2. marcar seleccionado
      btn.classList.add('active');

      // 3. guardar hora en el estado
      state.selectedTime = time;

      // 4. actualizar botón confirmar
      updateSubmitButton();
    });

    els.slotsContainer.appendChild(btn);
  });
}

    /** Envía la reserva al backend */
    async function submitAppointment(payload) {
      const res  = await fetch(`${API_BASE}/api/appointments`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Error al crear la reserva');
      return json.data;
    }
    // ════════════════════════════════════════════════════════
    //  INICIALIZACIÓN — se ejecuta al cargar la página
    // ════════════════════════════════════════════════════════

    async function init() {
      const slug = getSlugFromURL();

      if (!slug) {
        showError('No se especificó ningún negocio. Usa la URL: ?negocio=tu-negocio');
        return;
      }

      try {
        // Cargar las tres cosas en paralelo (más rápido que una por una)
        const [business, services, professionals] = await Promise.all([
          loadBusiness(slug),
          loadServices(slug),
          loadProfessionals(slug),
        ]);

        // Guardar el negocio en el estado
        state.business = business;

        // Mostrar datos del negocio en el header
        els.businessName.textContent = business.name;
        els.businessInfo.textContent =
          [business.phone, business.address].filter(Boolean).join(' · ');

        // Actualizar el título de la pestaña del navegador
        document.title = `${business.name} – Reserva tu hora`;

        // Renderizar servicios
        els.servicesList.innerHTML = '';
        if (services.length === 0) {
          els.servicesList.innerHTML = '<p class="text-muted">No hay servicios disponibles.</p>';
        } else {
          services.forEach(s => renderOptionCard(els.servicesList, s, 'service'));
        }

        // Renderizar profesionales
        els.professionalsList.innerHTML = '';
        if (professionals.length === 0) {
          els.professionalsList.innerHTML = '<p class="text-muted">No hay profesionales disponibles.</p>';
        } else {
          professionals.forEach(p => renderOptionCard(els.professionalsList, p, 'professional'));
        }

      } catch (err) {
        showError(err.message);
      }
    }

    // ════════════════════════════════════════════════════════
    //  EVENTOS DE FORMULARIO
    // ════════════════════════════════════════════════════════

    // Re-evaluar botón cuando cambian fecha, hora o datos del cliente
    [els.inputDate, els.inputName, els.inputPhone].forEach(input => {
      input.addEventListener('input', updateSubmitButton);
    });

    els.inputDate.addEventListener('change', () => {
    state.selectedTime = null;
    loadAvailableSlots();
    updateSubmitButton();
  });

    // Establecer fecha mínima = hoy (no permitir reservas en el pasado)
    els.inputDate.min = new Date().toISOString().split('T')[0];

    // ── Envío del formulario ──
    els.btnSubmit.addEventListener('click', async () => {
      // Ocultar error previo
      els.submitError.style.display = 'none';

      // Construir el datetime combinando fecha + hora
      const scheduledAt = new Date(`${els.inputDate.value}T${state.selectedTime}:00`);

      // Preparar el payload para el backend
      const payload = {
        businessSlug:   state.business.slug,
        serviceId:      state.selectedService.id,
        professionalId: state.selectedPro.id,
        clientName:     els.inputName.value.trim(),
        clientPhone:    els.inputPhone.value.trim(),
        clientEmail:    els.inputEmail.value.trim() || null,
        scheduledAt:    scheduledAt.toISOString(),
        notes:          els.inputNotes.value.trim() || null,
      };

      // Mostrar estado de carga en el botón
      els.btnSubmit.disabled = true;
      els.btnSubmit.textContent = 'Enviando...';

      try {
        const appointment = await submitAppointment(payload);

        // Mostrar pantalla de confirmación
        els.bookingForm.style.display  = 'none';
        els.confirmScreen.style.display = 'block';
        els.confirmDetail.textContent =
          `${state.selectedService.name} con ${state.selectedPro.name} — ` +
          formatDateTime(appointment.scheduled_at);

      } catch (err) {
        // Mostrar el error debajo del botón sin perder el formulario
        els.submitError.textContent = err.message;
        els.submitError.style.display = 'block';
        els.btnSubmit.disabled = false;
        els.btnSubmit.textContent = 'Confirmar reserva';
      }
    });

    // ── Arrancar ──
    init();
  </script>

</body>
</html>
