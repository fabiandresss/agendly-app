<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nueva contraseña — AGENDLY</title>
  <link rel="stylesheet" href="styles/design-system.css?v=0c902f78"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
  <style>
    body {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* Panel derecho */
    .form-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      overflow-y: auto;
    }
    .form-box {
      width: 100%;
      max-width: 400px;
    }
    .form-heading {
      margin-bottom: 32px;
    }
    .form-heading h2 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-primary);
    }
    .form-heading p {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .fgroup {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 16px;
    }
    .flabel {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap .form-input {
      padding-right: 42px;
    }
    .toggle-pw {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      font-size: 17px;
      padding: 10px;
      margin-right: -6px;
      transition: color var(--transition-fast);
    }
    .toggle-pw:hover { color: var(--text-secondary); }
    .form-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 22px;
    }
    .form-footer a {
      color: var(--brand-primary);
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      padding: 8px 4px;
    }
    .form-footer a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .form-panel { padding: 32px 24px; align-items: flex-start; padding-top: 52px; }
    }
  </style>
  <script src="config.js?v=7a999ca1"></script>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="styles/auth.css?v=8f0a8457"/>
</head>
<body>

  <header class="ob-topbar">
    <a href="index.html" class="ob-logo" aria-label="Agendly"><img src="assets/logo.png" alt="Agendly" style="height:28px;width:auto;display:block;"></a>
    <div class="ob-top-right"><span class="ob-top-q">¿Ya la recordaste?</span><a href="login.html" class="ob-top-cta">Iniciar sesión</a></div>
  </header>

  <div class="form-panel">
    <div class="form-box animate-in">

      <div class="form-heading">
        <h2>Crea tu nueva contraseña</h2>
        <p>Elige una contraseña de al menos 8 caracteres.</p>
      </div>

      <div class="alert alert-error mb-4" id="msg-error"><span id="msg-error-text"></span></div>
      <div class="alert alert-success mb-4" id="msg-ok"><span id="msg-ok-text"></span></div>

      <form id="reset-form" novalidate>
        <div class="fgroup">
          <label class="flabel" for="password">Nueva contraseña</label>
          <div class="input-wrap">
            <input type="password" id="password" class="form-input"
                   placeholder="Mínimo 8 caracteres" autocomplete="new-password"/>
            <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Mostrar contraseña">
              <i id="pw-icon" class="ti ti-eye"></i>
            </button>
          </div>
        </div>

        <div class="fgroup" style="margin-bottom:24px;">
          <label class="flabel" for="confirm">Confirmar contraseña</label>
          <input type="password" id="confirm" class="form-input"
                 placeholder="Repite la contraseña" autocomplete="new-password"/>
        </div>

        <button type="submit" id="btn-reset" class="btn btn-primary btn-lg btn-full">
          Guardar contraseña
        </button>
      </form>

      <div class="form-footer" id="footer-default">
        <a href="login.html">&larr; Volver a iniciar sesión</a>
      </div>
      <div class="form-footer" id="footer-expired" style="display:none;">
        <a href="forgot-password.html">Solicitar un enlace nuevo</a>
      </div>

    </div>
  </div>

  <script>
    const API   = AGENDLY_API;
    const $     = id => document.getElementById(id);
    const token = new URLSearchParams(location.search).get('token');

    function showError(msg) { $('msg-ok').classList.remove('visible'); $('msg-error-text').textContent = msg; $('msg-error').classList.add('visible'); }
    function showOk(msg)    { $('msg-error').classList.remove('visible'); $('msg-ok-text').textContent = msg; $('msg-ok').classList.add('visible'); }

    function togglePw() {
      const input = $('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      $('pw-icon').className = input.type === 'password' ? 'ti ti-eye' : 'ti ti-eye-off';
    }

    function linkExpired(msg) {
      showError(msg);
      $('reset-form').style.display = 'none';
      $('footer-default').style.display = 'none';
      $('footer-expired').style.display = 'block';
    }

    if (!token) linkExpired('El enlace no es válido. Solicita uno nuevo.');

    ['password', 'confirm'].forEach(id => $(id).addEventListener('input', () => $('msg-error').classList.remove('visible')));

    $('reset-form').addEventListener('submit', async e => {
      e.preventDefault();
      const password = $('password').value;

      if (password.length < 8)            { showError('La contraseña debe tener al menos 8 caracteres'); return; }
      if (password !== $('confirm').value) { showError('Las contraseñas no coinciden'); return; }

      const btn = $('btn-reset');
      btn.classList.add('btn-loading');
      btn.disabled = true;

      try {
        const res  = await fetch(`${API}/api/auth/reset-password`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, newPassword: password }),
        });
        const json = await res.json();

        if (res.status === 400 && /enlace/i.test(json.error || '')) { linkExpired(json.error); return; }
        if (!res.ok) { showError(json.error || 'No pudimos cambiar la contraseña'); return; }

        sessionStorage.clear();
        showOk(json.message);
        $('reset-form').style.display = 'none';
        setTimeout(() => { location.href = 'login.html'; }, 2500);
        return;
      } catch {
        showError('Error de conexión con el servidor');
      } finally {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
