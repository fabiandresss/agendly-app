<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de administración – AGENDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    :root {
      --agendly-primary: #4f46e5;
      --agendly-surface: #f8f7ff;
      --agendly-border:  #e5e3ff;
      --agendly-text:    #1e1b4b;
      --agendly-muted:   #6b7280;
    }

    body {
      background: var(--agendly-surface);
      color: var(--agendly-text);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ── Topbar ── */
    .topbar {
      background: var(--agendly-primary);
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar h1 { font-size: 1.15rem; font-weight: 700; margin: 0; }
    .topbar span { font-size: 0.875rem; opacity: 0.8; }

    /* ── Tarjetas de métricas ── */
    .metric-card {
      background: white;
      border: 1px solid var(--agendly-border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      text-align: center;
    }
    .metric-card .metric-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--agendly-primary);
      line-height: 1;
    }
    .metric-card .metric-label {
      font-size: 0.8rem;
      color: var(--agendly-muted);
      margin-top: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Tabla ── */
    .table-card {
      background: white;
      border: 1px solid var(--agendly-border);
      border-radius: 16px;
      overflow: hidden;
    }
    .table-card .table { margin: 0; }
    .table thead th {
      background: #f5f4ff;
      color: var(--agendly-muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--agendly-border);
      padding: 0.85rem 1rem;
    }
    .table tbody td {
      padding: 0.9rem 1rem;
      vertical-align: middle;
      border-color: #f0efff;
      font-size: 0.9rem;
    }
    .table tbody tr:last-child td { border-bottom: none; }
    .table tbody tr:hover td { background: #faf9ff; }

    /* ── Badges de estado ── */
    .badge-status {
      display: inline-block;
      padding: 0.3em 0.75em;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .badge-pending   { background: #fef9c3; color: #854d0e; }
    .badge-confirmed { background: #dbeafe; color: #1e40af; }
    .badge-completed { background: #dcfce7; color: #166534; }
    .badge-cancelled { background: #fee2e2; color: #991b1b; }

    /* ── Botones de acción ── */
    .btn-action {
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-action:hover   { opacity: 0.8; }
    .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-confirm   { background: #dbeafe; color: #1e40af; }
    .btn-complete  { background: #dcfce7; color: #166534; }
    .btn-cancel    { background: #fee2e2; color: #991b1b; }

    /* ── Filtros ── */
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--agendly-border);
    }
    .filter-btn {
      border: 1px solid var(--agendly-border);
      background: white;
      border-radius: 20px;
      padding: 0.3rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--agendly-muted);
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--agendly-primary);
      border-color: var(--agendly-primary);
      color: white;
    }
    .filter-bar input {
      border: 1px solid var(--agendly-border);
      border-radius: 8px;
      padding: 0.3rem 0.75rem;
      font-size: 0.85rem;
      outline: none;
      margin-left: auto;
      width: 200px;
    }
    .filter-bar input:focus { border-color: var(--agendly-primary); }

    /* ── Toast de notificación ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #1e1b4b;
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      z-index: 9999;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── Estados vacíos y error ── */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--agendly-muted);
    }
    .empty-state p { margin: 0; font-size: 0.95rem; }
    #error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    /* ── Skeleton loader ── */
    .skeleton-row td {
      padding: 1rem !important;
    }
    .skeleton-cell {
      height: 16px;
      border-radius: 6px;
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
</head>

<body>

<div class="topbar">
  <h1>AGENDLY — Panel de administración</h1>
  <div style="display:flex; align-items:center; gap:1rem;">
    <span id="topbar-business"></span>
    <button id="btn-logout" style="
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      border-radius: 8px;
      padding: 0.35rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;">
      Cerrar sesión
    </button>
  </div>
</div>

  <div class="container-fluid py-4 px-4" style="max-width: 1100px;">

    <div id="error-banner"></div>

    <!-- Métricas rápidas -->
    <div class="row g-3 mb-4" id="metrics-row">
      <div class="col-6 col-md-3">
        <div class="metric-card">
          <div class="metric-value" id="m-total">—</div>
          <div class="metric-label">Total reservas</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="metric-card">
          <div class="metric-value" id="m-pending" style="color:#854d0e;">—</div>
          <div class="metric-label">Pendientes</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="metric-card">
          <div class="metric-value" id="m-confirmed" style="color:#1e40af;">—</div>
          <div class="metric-label">Confirmadas</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="metric-card">
          <div class="metric-value" id="m-completed" style="color:#166534;">—</div>
          <div class="metric-label">Completadas</div>
        </div>
      </div>
    </div>

    <!-- Tabla de reservas -->
    <div class="table-card">

      <!-- Barra de filtros -->
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="pending">Pendientes</button>
        <button class="filter-btn" data-filter="confirmed">Confirmadas</button>
        <button class="filter-btn" data-filter="completed">Completadas</button>
        <button class="filter-btn" data-filter="cancelled">Canceladas</button>
        <input type="text" id="search-input" placeholder="Buscar cliente..." />
      </div>

      <!-- Tabla -->
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Servicio</th>
              <th>Profesional</th>
              <th>Fecha y hora</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="appointments-tbody">
            <!-- Skeletons iniciales -->
            <tr class="skeleton-row">
              <td><div class="skeleton-cell"></div></td>
              <td><div class="skeleton-cell"></div></td>
              <td><div class="skeleton-cell"></div></td>
              <td><div class="skeleton-cell"></div></td>
              <td><div class="skeleton-cell" style="width:80px"></div></td>
              <td><div class="skeleton-cell" style="width:120px"></div></td>
            </tr>
            <tr class="skeleton-row">
              <td><div class="skeleton-cell"></div></td>
              <td><div class="skeleton-cell"></div></td>
              <td><div class="skeleton-cell"></div></td>
              <td><div class="skeleton-cell"></div></td>
              <td><div class="skeleton-cell" style="width:80px"></div></td>
              <td><div class="skeleton-cell" style="width:120px"></div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Toast de notificación -->
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_BASE = 'http://localhost:3000';

// ── Verificar sesión al cargar ──
// Si no hay token guardado, redirigir a login inmediatamente
const SESSION_TOKEN = sessionStorage.getItem('agendly_token');
const SESSION_EMAIL = sessionStorage.getItem('agendly_email');

if (!SESSION_TOKEN) {
  window.location.href = 'login.html';
}

// ── Headers autenticados ──
// Función helper: genera los headers con el JWT para cada fetch
function authHeaders() {
  return {
    'Content-Type':  'application/json',
    'Authorization': `Bearer ${SESSION_TOKEN}`,
  };
}

const state = {
  slug:         '',
  appointments: [],
  filtered:     [],
  activeFilter: 'all',
  searchTerm:   '',
};

const tbody       = document.getElementById('appointments-tbody');
const errorBanner = document.getElementById('error-banner');
const toast       = document.getElementById('toast');

function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.style.display = 'block';
}

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
}

function formatDateTime(iso) {
  return new Date(iso).toLocaleString('es-CL', {
    weekday: 'short', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit',
  });
}

const STATUS_LABELS = {
  pending:   'Pendiente',
  confirmed: 'Confirmada',
  completed: 'Completada',
  cancelled: 'Cancelada',
};

function badgeHTML(status) {
  return `<span class="badge-status badge-${status}">${STATUS_LABELS[status] ?? status}</span>`;
}

function updateMetrics(appointments) {
  const count = (s) => appointments.filter(a => a.status === s).length;
  document.getElementById('m-total').textContent     = appointments.length;
  document.getElementById('m-pending').textContent   = count('pending');
  document.getElementById('m-confirmed').textContent = count('confirmed');
  document.getElementById('m-completed').textContent = count('completed');
}

function applyFilters() {
  let result = state.appointments;
  if (state.activeFilter !== 'all') {
    result = result.filter(a => a.status === state.activeFilter);
  }
  if (state.searchTerm) {
    const term = state.searchTerm.toLowerCase();
    result = result.filter(a =>
      a.client_name.toLowerCase().includes(term) ||
      (a.client_phone && a.client_phone.includes(term))
    );
  }
  state.filtered = result;
  renderTable();
}

function renderTable() {
  const rows = state.filtered;
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><p>No hay reservas para mostrar.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(appt => {
    const service      = appt.services?.name      ?? '—';
    const professional = appt.professionals?.name ?? '—';
    const canConfirm   = appt.status === 'pending';
    const canComplete  = appt.status === 'confirmed';
    const canCancel    = appt.status === 'pending' || appt.status === 'confirmed';
    return `
      <tr data-id="${appt.id}">
        <td>
          <div style="font-weight:600;">${appt.client_name}</div>
          <div style="font-size:0.78rem;color:var(--agendly-muted);">${appt.client_phone}</div>
        </td>
        <td>${service}</td>
        <td>${professional}</td>
        <td style="white-space:nowrap;">${formatDateTime(appt.scheduled_at)}</td>
        <td>${badgeHTML(appt.status)}</td>
        <td>
          <div style="display:flex;gap:0.35rem;flex-wrap:wrap;">
            <button class="btn-action btn-confirm"  onclick="changeStatus('${appt.id}','confirmed')"  ${!canConfirm  ? 'disabled' : ''}>Confirmar</button>
            <button class="btn-action btn-complete" onclick="changeStatus('${appt.id}','completed')"  ${!canComplete ? 'disabled' : ''}>Completar</button>
            <button class="btn-action btn-cancel"   onclick="changeStatus('${appt.id}','cancelled')"  ${!canCancel   ? 'disabled' : ''}>Cancelar</button>
          </div>
        </td>
      </tr>`;
  }).join('');
}

async function changeStatus(appointmentId, newStatus) {
  const index = state.appointments.findIndex(a => a.id === appointmentId);
  if (index === -1) return;

  const prevStatus = state.appointments[index].status;
  state.appointments[index].status = newStatus;
  applyFilters();
  updateMetrics(state.appointments);

  try {
    const res  = await fetch(`${API_BASE}/api/appointments/${appointmentId}/status`, {
      method:  'PATCH',
      headers: authHeaders(),   // ← JWT incluido
      body:    JSON.stringify({ status: newStatus, businessSlug: state.slug }),
    });
    const json = await res.json();

    if (!res.ok) {
      // Si el token expiró, redirigir a login
      if (res.status === 401) {
        sessionStorage.clear();
        window.location.href = 'login.html';
        return;
      }
      state.appointments[index].status = prevStatus;
      applyFilters();
      updateMetrics(state.appointments);
      showToast(`Error: ${json.error}`);
      return;
    }

    state.appointments[index] = { ...state.appointments[index], ...json.data };
    applyFilters();
    updateMetrics(state.appointments);
    showToast(`Reserva marcada como ${STATUS_LABELS[newStatus].toLowerCase()}`);

  } catch (err) {
    state.appointments[index].status = prevStatus;
    applyFilters();
    updateMetrics(state.appointments);
    showToast('Error de conexión. Intenta de nuevo.');
  }
}

async function loadAppointments() {
  const res  = await fetch(`${API_BASE}/api/businesses/${state.slug}/appointments`, {
    headers: authHeaders(),   // ← JWT incluido
  });
  if (res.status === 401) {
    sessionStorage.clear();
    window.location.href = 'login.html';
    return [];
  }
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || 'Error al cargar reservas');
  return json.data;
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const slug   = params.get('negocio');

  if (!slug) {
    showError('Falta el parámetro ?negocio= en la URL');
    tbody.innerHTML = '';
    return;
  }

  state.slug = slug;

  // Mostrar email del usuario en el topbar
  document.getElementById('topbar-business').textContent = SESSION_EMAIL ?? '';

  try {
    const [businessRes, appointments] = await Promise.all([
      fetch(`${API_BASE}/api/businesses/${slug}`).then(r => r.json()),
      loadAppointments(),
    ]);

    if (!businessRes.data) {
      showError('Negocio no encontrado.');
      tbody.innerHTML = '';
      return;
    }

    document.getElementById('topbar-business').textContent =
      `${businessRes.data.name}  ·  ${SESSION_EMAIL}`;
    document.title = `${businessRes.data.name} — Panel AGENDLY`;

    state.appointments = appointments;
    updateMetrics(appointments);
    applyFilters();

  } catch (err) {
    showError(`Error al cargar datos: ${err.message}`);
    tbody.innerHTML = '';
  }
}

// Botón logout — agrégalo al HTML del topbar con id="btn-logout"
document.getElementById('btn-logout').addEventListener('click', () => {
  sessionStorage.clear();
  window.location.href = 'login.html';
});

// Filtros
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.activeFilter = btn.dataset.filter;
    applyFilters();
  });
});

let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.searchTerm = e.target.value.trim();
    applyFilters();
  }, 250);
});

init();

</script>
</body>
</html>
